<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cap Flight Viewer</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="panel">
        <h1>Cap Flight Viewer</h1>
        <p class="note">物理計算の正本は Python（cap_flight_sim）。ブラウザ内計算はその TS 移植版で、同条件の照合テストで一致を確認している。表示値は仮定係数に基づく計算値。</p>

        <section>
          <h2>条件を調整して計算</h2>
          <div id="sim-panel"></div>
        </section>

        <section>
          <h2>データ</h2>
          <label class="file">viewer.json を追加 <input id="file-input" type="file" accept=".json" multiple /></label>
          <div id="samples"></div>
          <div id="runs"></div>
        </section>

        <section>
          <h2>表示区分</h2>
          <div id="label-filters"></div>
        </section>

        <section>
          <h2>再生</h2>
          <div class="row">
            <button id="step-back" title="1フレーム戻す">⏮</button>
            <button id="play">▶ 再生</button>
            <button id="step-forward" title="1フレーム送る">⏭</button>
            <select id="speed">
              <option value="0.05">×0.05</option>
              <option value="0.1">×0.1</option>
              <option value="0.25" selected>×0.25</option>
              <option value="0.5">×0.5</option>
              <option value="1">×1</option>
            </select>
          </div>
          <input id="seek" type="range" min="0" max="1000" value="0" />
          <div id="seek-label" class="mono"></div>
          <label>同期 <select id="sync-mode"></select></label>
        </section>

        <section>
          <h2>カメラ</h2>
          <div class="row">
            <button data-view="top">上面</button>
            <button data-view="side">側面</button>
            <button data-view="catcher">捕手側</button>
            <button data-view="free">自由</button>
          </div>
        </section>

        <section>
          <h2>ベクトル（表示倍率は見かけのみ）</h2>
          <div id="vector-toggles"></div>
          <label>力 <input id="force-scale" type="range" min="0" max="3" step="0.05" value="1" /> <span id="force-scale-label" class="mono"></span></label>
          <label>速度 <input id="velocity-scale" type="range" min="-3" max="0" step="0.05" value="-1.3" /> <span id="velocity-scale-label" class="mono"></span></label>
          <label>キャップ拡大 <input id="cap-scale" type="range" min="1" max="10" step="1" value="3" /> <span id="cap-scale-label" class="mono"></span></label>
        </section>
      </aside>

      <main id="viewport">
        <div id="hud" class="mono"></div>
        <div id="legend"></div>
        <div id="exaggeration" class="badge"></div>
        <div id="warnings"></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
