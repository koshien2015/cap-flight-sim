[project]
name = "cap-flight-sim"
version = "0.1.0"
description = "キャップ野球用 6自由度フライトシミュレーター（研究・仮説検証用）"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
cap-flight-sim = "cap_flight_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cap_flight_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
